<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventPass | Organizer dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1>Organizer dashboard</h1>
        <div class="who" id="who"></div>
      </div>
      <div class="nav">
        <a href="/events.html">All events</a>
        <button class="btn small ghost" id="logout" type="button">Log out</button>
      </div>
    </div>

    <div class="card">
      <h2 class="section" style="margin-top:0">Create an event</h2>
      <form id="form" novalidate>
        <label for="title">Title</label>
        <input id="title">
        <label for="description">Description (optional)</label>
        <input id="description">
        <label for="venue">Venue</label>
        <input id="venue">
        <div class="row2">
          <div>
            <label for="event_date">Date and time</label>
            <input id="event_date" type="datetime-local">
          </div>
          <div>
            <label for="seat_limit">Seats</label>
            <input id="seat_limit" type="number" min="1" value="50">
          </div>
        </div>
        <label>Open to departments <span class="who">(tick none = everyone)</span></label>
        <div id="depts" class="checks"></div>
        <label for="form_url">Google Form link (optional)</label>
        <input id="form_url" type="url" placeholder="https://forms.gle/...">
        <button class="btn block" type="submit" id="submit">Publish event</button>
      </form>
      <div id="msg" class="msg" role="status"></div>
    </div>

    <h2 class="section">Your events</h2>
    <div id="list"></div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (!App.token()) location.href = "/";
    const user = App.user();
    if (user.role !== "organizer") location.href = App.home(user);
    document.getElementById("who").textContent = user.name + " (organizer)";
    document.getElementById("logout").onclick = App.logout;

    const $ = (id) => document.getElementById(id);
    const msg = $("msg");
    const list = $("list");

    App.call("/api/departments").then((names) => {
      for (const d of names) {
        const label = el("label", "check");
        const box = el("input");
        box.type = "checkbox";
        box.value = d;
        label.append(box, " " + d);
        $("depts").append(label);
      }
    });

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    async function load() {
      try {
        const all = await App.call("/api/events");
        const mine = all.filter((ev) => ev.organizer_id === user.id);
        const stats = await Promise.all(
          mine.map((ev) => App.call("/api/events/" + ev.id + "/attendance"))
        );

        list.replaceChildren();
        if (mine.length === 0) {
          list.append(el("div", "empty", "You haven't created any events yet."));
          return;
        }
        mine.forEach((ev, i) => {
          const s = stats[i];
          const card = el("div", "card event");
          card.append(el("h2", "", ev.title));
          card.append(el("div", "meta", "Venue: " + ev.venue));
          card.append(el("div", "meta", "When: " + new Date(ev.event_date).toLocaleString()));
          const foot = el("div", "event-foot");
          foot.append(el("span", "seats",
            s.registered + " / " + ev.seat_limit + " registered, " + s.checked_in + " checked in"));
          const manage = el("a", "btn small", "Participants and attendance");
          manage.href = "/manage.html?event=" + ev.id;
          foot.append(manage);
          card.append(foot);
          list.append(card);
        });
      } catch (err) {
        App.say(msg, err.message, "error");
      }
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("submit").disabled = true;
      try {
        await App.call("/api/events", {
          method: "POST",
          body: {
            title: $("title").value,
            description: $("description").value,
            venue: $("venue").value,
            event_date: $("event_date").value,
            seat_limit: Number($("seat_limit").value),
            allowed_departments: [...document.querySelectorAll("#depts input:checked")].map((b) => b.value),
            form_url: $("form_url").value.trim(),
          },
        });
        App.say(msg, "Event published.", "ok");
        $("form").reset();
        $("seat_limit").value = 50;
        await load();
      } catch (err) {
        App.say(msg, err.message, "error");
      } finally {
        $("submit").disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
