<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventPass | Participants and attendance</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1 id="title">Attendance</h1>
        <div class="who" id="stats"></div>
      </div>
      <div class="nav">
        <a href="/organizer.html">Dashboard</a>
        <button class="btn small ghost" id="logout" type="button">Log out</button>
      </div>
    </div>

    <div class="card">
      <label for="code">Check in by ticket code (type or paste)</label>
      <div class="toolbar" style="margin-bottom:0">
        <input id="code" placeholder="32-character ticket code" autocomplete="off">
        <button class="btn small" id="checkin" type="button">Check in</button>
      </div>
      <div id="msg" class="msg" role="status"></div>
    </div>

    <div class="toolbar">
      <input id="search" placeholder="Search name, email or department">
      <button class="btn small" id="download" type="button">Download report (CSV)</button>
    </div>

    <div class="card table-wrap">
      <table>
        <thead>
          <tr><th>Name</th><th>Department</th><th>Email</th><th>Status</th><th>Mark</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (!App.token()) location.href = "/";
    const user = App.user();
    if (user.role !== "organizer") location.href = App.home(user);
    const eventId = Number(new URLSearchParams(location.search).get("event"));
    if (!eventId) location.href = "/organizer.html";
    document.getElementById("logout").onclick = App.logout;

    const $ = (id) => document.getElementById(id);
    const msg = $("msg");
    let data = null;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render() {
      $("title").textContent = data.event;
      $("stats").textContent =
        data.registered + " registered, " + data.checked_in + " present, " +
        (data.registered - data.checked_in) + " absent";

      const q = $("search").value.trim().toLowerCase();
      const rows = data.attendees.filter((a) =>
        (a.name + " " + a.email + " " + (a.department || "")).toLowerCase().includes(q));

      const body = $("rows");
      body.replaceChildren();
      if (rows.length === 0) {
        const tr = el("tr");
        const td = el("td", "empty", "No participants to show.");
        td.colSpan = 5;
        tr.append(td);
        body.append(tr);
        return;
      }
      for (const a of rows) {
        const tr = el("tr");
        tr.append(el("td", "", a.name), el("td", "", a.department || "-"), el("td", "", a.email));
        const status = el("td");
        status.append(el("span", "badge" + (a.checked_in_at ? " done" : ""), a.checked_in_at ? "Present" : "Absent"));
        tr.append(status);
        const action = el("td");
        const btn = el("button", "btn small" + (a.checked_in_at ? " ghost" : ""), a.checked_in_at ? "Undo" : "Mark present");
        btn.type = "button";
        btn.onclick = () => mark(a, !a.checked_in_at);
        action.append(btn);
        tr.append(action);
        body.append(tr);
      }
    }

    async function load() {
      try {
        data = await App.call("/api/events/" + eventId + "/attendance");
        render();
      } catch (err) {
        App.say(msg, err.message, "error");
      }
    }

    async function mark(a, present) {
      try {
        await App.call("/api/events/" + eventId + "/attendance/" + a.registration_id, {
          method: "PUT",
          body: { present },
        });
        await load();
      } catch (err) {
        App.say(msg, err.message, "error");
      }
    }

    $("search").addEventListener("input", () => data && render());

    $("checkin").onclick = async () => {
      const code = $("code").value.trim();
      try {
        const r = await App.call("/api/checkin", { method: "POST", body: { ticket_code: code } });
        App.say(msg, r.student_name + " checked in.", "ok");
        $("code").value = "";
        await load();
      } catch (err) {
        App.say(msg, err.message, "error"); // invalid, already checked in, wrong event...
      }
    };

    $("download").onclick = async () => {
      try {
        const res = await fetch("/api/events/" + eventId + "/attendance.csv", {
          headers: { Authorization: "Bearer " + App.token() },
        });
        if (!res.ok) throw new Error("Could not download the report");
        const url = URL.createObjectURL(await res.blob());
        const link = document.createElement("a");
        link.href = url;
        link.download = "attendance-" + data.event.replace(/[^a-z0-9]+/gi, "-") + ".csv";
        link.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        App.say(msg, err.message, "error");
      }
    };

    load();
  </script>
</body>
</html>
