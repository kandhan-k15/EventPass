<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventPass | Participants and attendance</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1 id="title">Attendance</h1>
        <div class="who" id="stats"></div>
      </div>
      <div class="nav">
        <a href="/organizer.html">Dashboard</a>
        <button class="btn small ghost" id="logout" type="button">Log out</button>
      </div>
    </div>

    <div class="card">
      <strong>Check-in</strong>
      <div class="toolbar">
        <button class="btn small" id="scan" type="button">Scan with camera</button>
      </div>
      <div class="scan-box" id="scanbox" hidden>
        <video id="video" playsinline muted></video>
        <p class="hint">Hold the student’s QR code in front of the camera.</p>
      </div>
      <label for="code">Or type the code printed under the QR</label>
      <div class="toolbar" style="margin-bottom:0">
        <input id="code" placeholder="32-character ticket code" autocomplete="off">
        <button class="btn small" id="checkin" type="button">Check in</button>
      </div>
      <div id="msg" class="msg" role="status"></div>
    </div>

    <div class="toolbar">
      <input id="search" placeholder="Search name, email or department">
      <button class="btn small" id="download" type="button">Download report (CSV)</button>
    </div>

    <div class="card table-wrap">
      <table>
        <thead>
          <tr><th>Name</th><th>Department</th><th>Email</th><th>Status</th><th>Mark</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (!App.token()) location.href = "/";
    const user = App.user();
    if (!user || user.role !== "organizer") location.href = App.home(user);
    const eventId = Number(new URLSearchParams(location.search).get("event"));
    if (!eventId) location.href = "/organizer.html";
    document.getElementById("logout").onclick = App.logout;

    const $ = (id) => document.getElementById(id);
    const msg = $("msg");
    let data = null;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render() {
      $("title").textContent = data.event;
      $("stats").textContent =
        data.registered + " registered, " + data.checked_in + " present, " +
        (data.registered - data.checked_in) + " absent" +
        (data.waiting ? ", " + data.waiting + " on waiting list" : "");

      const q = $("search").value.trim().toLowerCase();
      const rows = data.attendees.filter((a) =>
        (a.name + " " + a.email + " " + (a.department || "")).toLowerCase().includes(q)
      );

      const body = $("rows");
      body.replaceChildren();
      if (rows.length === 0) {
        const tr = el("tr");
        const td = el("td", "empty", "No participants to show.");
        td.colSpan = 5;
        tr.append(td);
        body.append(tr);
        return;
      }
      for (const a of rows) {
        const tr = el("tr");
        tr.append(el("td", "", a.name), el("td", "", a.department || "-"), el("td", "", a.email));
        const status = el("td");
        status.append(el("span", "badge" + (a.checked_in_at ? " done" : ""), a.checked_in_at ? "Present" : "Absent"));
        tr.append(status);
        const action = el("td");
        const btn = el("button", "btn small" + (a.checked_in_at ? " ghost" : ""), a.checked_in_at ? "Undo" : "Mark present");
        btn.type = "button";
        btn.onclick = () => mark(a, !a.checked_in_at);
        action.append(btn);
        tr.append(action);
        body.append(tr);
      }
    }

    async function load() {
      try {
        data = await App.call("/api/events/" + eventId + "/attendance");
        render();
      } catch (err) {
        App.say(msg, err.message, "error");
      }
    }

    async function mark(a, present) {
      try {
        await App.call("/api/events/" + eventId + "/attendance/" + a.registration_id, {
          method: "PUT",
          body: { present },
        });
        await load();
      } catch (err) {
        App.say(msg, err.message, "error");
      }
    }

    $("search").addEventListener("input", () => data && render());

    async function doCheckin(code) {
      try {
        const r = await App.call("/api/checkin", {
          method: "POST",
          body: { ticket_code: code.trim(), event_id: eventId },
        });
        App.say(msg, "✓ " + r.student_name + " checked in.", "ok");
        await load();
        return true;
      } catch (err) {
        App.say(msg, err.message, "error");
        return false;
      }
    }

    $("checkin").onclick = async () => {
      if (await doCheckin($("code").value)) $("code").value = "";
    };

    const video = $("video");
    const canvas = document.createElement("canvas");
    let stream = null;
    let scanning = false;
    let lastCode = "";
    let lastTime = 0;

    function stopScan() {
      scanning = false;
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = null;
      video.srcObject = null;
      $("scanbox").hidden = true;
      $("scan").textContent = "Scan with camera";
    }

    function tick() {
      if (!scanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const found = jsQR(img.data, img.width, img.height);
        if (found && found.data) {
          const now = Date.now();
          if (found.data !== lastCode || now - lastTime > 3000) {
            lastCode = found.data;
            lastTime = now;
            doCheckin(found.data);
          }
        }
      }
      setTimeout(tick, 200);
    }

    $("scan").onclick = async () => {
      if (scanning) return stopScan();
      if (typeof jsQR === "undefined") {
        return App.say(msg, "The scanner could not load. Type the code instead.", "error");
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      } catch {
        return App.say(msg, "Camera not available. Allow camera access (https:// or localhost), or type the code.", "error");
      }
      video.srcObject = stream;
      await video.play();
      $("scanbox").hidden = false;
      $("scan").textContent = "Stop camera";
      scanning = true;
      tick();
    };
    window.addEventListener("pagehide", stopScan);

    $("download").onclick = async () => {
      try {
        const res = await fetch("/api/events/" + eventId + "/attendance.csv", {
          headers: { Authorization: "Bearer " + App.token() },
        });
        if (!res.ok) throw new Error("Could not download the report");
        const url = URL.createObjectURL(await res.blob());
        const link = document.createElement("a");
        link.href = url;
        link.download = "attendance-" + data.event.replace(/[^a-z0-9]+/gi, "-") + ".csv";
        link.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        App.say(msg, err.message, "error");
      }
    };

    load();
  </script>
</body>
</html>
