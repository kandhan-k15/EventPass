<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventPass | My tickets</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1>My tickets</h1>
        <div class="who" id="who"></div>
      </div>
      <div class="nav">
        <a href="/events.html">Events</a>
        <button class="btn small ghost" id="logout" type="button">Log out</button>
      </div>
    </div>

    <div id="msg" class="msg" role="status"></div>
    <div id="list"></div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (!App.token()) location.href = "/";
    const user = App.user();
    if (user.role !== "student") location.href = App.home(user);
    document.getElementById("who").textContent = user.name;
    document.getElementById("logout").onclick = App.logout;

    const msg = document.getElementById("msg");
    const list = document.getElementById("list");

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    async function showQr(ticket, btn, box) {
      btn.disabled = true;
      try {
        const data = await App.call("/api/tickets/" + ticket.registration_id);
        box.replaceChildren();
        const img = el("img");
        img.alt = "QR code for " + ticket.title;
        img.src = data.qr;
        box.append(img, el("div", "code", data.ticket_code));
        btn.hidden = true;
      } catch (err) {
        App.say(msg, err.message, "error");
        btn.disabled = false;
      }
    }

    async function load() {
      try {
        const tickets = await App.call("/api/my-tickets");
        list.replaceChildren();
        if (tickets.length === 0) {
          list.append(el("div", "empty", "No tickets yet. Register for an event first."));
          return;
        }
        for (const t of tickets) {
          const card = el("div", "card event");
          card.append(el("h2", "", t.title));
          card.append(el("div", "meta", "Venue: " + t.venue));
          card.append(el("div", "meta", "When: " + new Date(t.event_date).toLocaleString()));

          const foot = el("div", "event-foot");
          foot.append(el("span", "badge" + (t.checked_in_at ? " done" : ""), t.status));
          const btn = el("button", "btn small", "Show QR code");
          btn.type = "button";
          foot.append(btn);
          card.append(foot);

          const box = el("div", "qr");
          card.append(box);
          btn.onclick = () => showQr(t, btn, box);
          list.append(card);
        }
      } catch (err) {
        App.say(msg, err.message, "error");
      }
    }
    load();
  </script>
</body>
</html>
